{% extends "base.html" %}
{% set page_title = "Page not found" %}
{% set noindex = true %}
{% block content %}
<section class="section">
  <div class="container container--narrow text-center">
    <p class="eyebrow">Error 404</p>
    <h1>{{ title }}</h1>
    <p class="lead">{{ message }}</p>
    <div class="cluster mt-6">
      <a class="btn btn--primary" href="/">Go to the homepage</a>
      <a class="btn btn--outline" href="/blog">Read our stories</a>
    </div>
  </div>
</section>
{% endblock %}
