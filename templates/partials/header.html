<header class="site-header">
  <div class="container site-header__inner">
    <a class="logo" href="/">
      {% include "partials/logo.html" %}
      <span>{{ brand.name }}</span>
    </a>
    <button class="btn btn--outline btn--sm nav-toggle" type="button" data-nav-toggle
            aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {% for label, href in nav_items %}
        <li><a href="{{ href }}"{% if is_active(current_path, href) %} aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
        <li class="nav-cta"><a class="btn btn--accent btn--sm" href="/donate"{% if is_active(current_path, "/donate") %} aria-current="page"{% endif %}>Donate</a></li>
      </ul>
    </nav>
  </div>
</header>
