[project]
name = "akshar-foundation"
version = "1.0.0"
description = "Portfolio website for a fictional education NGO, built with FastAPI, Jinja2 and SQLite."
requires-python = ">=3.11"
# Dependencies live in requirements*.txt so installs are pinned and reproducible.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", # we deliberately use the rupee sign and typographic quotes in copy
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S311"]  # synthetic data generation does not need crypto-grade randomness
"app/seed.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
